<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#E05D00" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F06A05" flood-opacity="0.25" />
    </filter>
    <clipPath id="foodThumbClip">
      <rect width="158" height="110" rx="14" />
    </clipPath>
    <clipPath id="avatarClip">
      <circle cx="27" cy="27" r="27" />
    </clipPath>
  </defs>

  <!-- Device Background (Clean Modern Soft Canvas) -->
  <rect width="375" height="812" fill="#F4F6F8" />

  <!-- ========================================================================= -->
  <!-- 1. COMPACT PREMIUM HEADER (Swiggy/Zomato style, replaces 35% giant orange block) -->
  <!-- ========================================================================= -->
  <g id="header">
    <!-- Header Background with Subtle Bottom Curve -->
    <path d="M 0 0 L 375 0 L 375 148 C 375 148 280 156 187.5 156 C 95 156 0 148 0 148 Z" fill="url(#headerGrad)" />

    <!-- Status Bar Safe Space & Brand Row -->
    <g transform="translate(18, 44)">
      <!-- New Minimalist "Y-Pin" Monogram (Concept 1) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="34" height="34" rx="10" fill="#FFFFFF" />
        <path d="M 11 11 L 17 19 L 23 11" fill="none" stroke="#E05D00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 17 19 L 17 25" fill="none" stroke="#E05D00" stroke-width="3" stroke-linecap="round" />
        <circle cx="17" cy="13" r="1.5" fill="#E05D00" />
      </g>
      
      <!-- Brand Wordmark + Campus Location Selector -->
      <g transform="translate(42, 2)">
        <text x="0" y="14" fill="#FFFFFF" font-size="16" font-weight="900" class="font-sans" letter-spacing="-0.4">yemunnai</text>
        <g transform="translate(0, 20)">
          <!-- Location Pin SVG -->
          <path d="M 4 2 C 2.5 2 1.5 3 1.5 4.5 C 1.5 6.5 4 8.5 4 8.5 C 4 8.5 6.5 6.5 6.5 4.5 C 6.5 3 5.5 2 4 2 Z" fill="#FFEAD9" />
          <text x="9" y="8" fill="#FFEAD9" font-size="10" font-weight="700" class="font-sans">MITS Food Court</text>
          <path d="M 88 5 L 91 8 L 94 5" fill="none" stroke="#FFEAD9" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </g>

      <!-- Cart Button with Live Counter Badge -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="34" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.3" />
        <!-- Cart Icon -->
        <path d="M 9 10 L 12 10 L 14.5 21 L 24 21 L 26 13 L 13 13" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="15.5" cy="24" r="1.5" fill="#FFFFFF" />
        <circle cx="22.5" cy="24" r="1.5" fill="#FFFFFF" />
        <!-- Badge -->
        <circle cx="28" cy="6" r="7" fill="#10B981" stroke="#E05D00" stroke-width="1.5" />
        <text x="28" y="9.5" fill="#FFFFFF" font-size="8.5" font-weight="900" text-anchor="middle" class="font-sans">2</text>
      </g>
    </g>

    <!-- Sleek Floating Search Bar -->
    <g transform="translate(18, 98)">
      <rect x="0" y="0" width="339" height="42" rx="21" fill="#FFFFFF" filter="url(#cardShadow)" />
      <!-- Search Magnifier Icon -->
      <circle cx="22" cy="21" r="5.5" fill="none" stroke="#94A3B8" stroke-width="1.8" />
      <line x1="26" y1="25" x2="31" y2="30" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
      <!-- Cycling Placeholder Text -->
      <text x="38" y="25" fill="#94A3B8" font-size="12" font-weight="600" class="font-sans">Search &quot;samosa, dosa, tea, puff...&quot;</text>
      <!-- Mic / Scan Pill -->
      <g transform="translate(300, 11)">
        <rect x="0" y="0" width="20" height="20" rx="6" fill="#FFF7ED" />
        <path d="M 10 5 C 8.5 5 7.5 6 7.5 7.5 L 7.5 10 C 7.5 11.5 8.5 12.5 10 12.5 C 11.5 12.5 12.5 11.5 12.5 10 L 12.5 7.5 C 12.5 6 11.5 5 10 5 Z" fill="#F06A05" />
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CANTEEN CIRCLES (Horizontal Story Avatars with Clean Online Ring) -->
  <!-- ========================================================================= -->
  <g transform="translate(18, 172)">
    <text x="0" y="0" fill="#0F172A" font-size="12" font-weight="800" class="font-sans" letter-spacing="-0.2">CAMPUS OUTLETS</text>
    <text x="339" y="0" fill="#F06A05" font-size="11" font-weight="700" text-anchor="end" class="font-sans">View All (5) →</text>

    <!-- Canteen Avatars List -->
    <g transform="translate(0, 12)">
      <!-- Outlet 1: MITS Canteen (Active Selection) -->
      <g transform="translate(0, 0)">
        <circle cx="27" cy="27" r="28" fill="none" stroke="#F06A05" stroke-width="2.5" />
        <circle cx="27" cy="27" r="24" fill="#E2E8F0" />
        <text x="27" y="31" fill="#0F172A" font-size="18" text-anchor="middle">🍲</text>
        <circle cx="43" cy="43" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="27" y="66" fill="#0F172A" font-size="10" font-weight="800" text-anchor="middle" class="font-sans">Canteen</text>
      </g>

      <!-- Outlet 2: MITS Cafe -->
      <g transform="translate(68, 0)">
        <circle cx="27" cy="27" r="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <text x="27" y="31" fill="#0F172A" font-size="18" text-anchor="middle">☕</text>
        <circle cx="43" cy="43" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="27" y="66" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">MITS Cafe</text>
      </g>

      <!-- Outlet 3: Ekdant's -->
      <g transform="translate(136, 0)">
        <circle cx="27" cy="27" r="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <text x="27" y="31" fill="#0F172A" font-size="18" text-anchor="middle">🥪</text>
        <circle cx="43" cy="43" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="27" y="66" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">Ekdant's</text>
      </g>

      <!-- Outlet 4: Lickies -->
      <g transform="translate(204, 0)">
        <circle cx="27" cy="27" r="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <text x="27" y="31" fill="#0F172A" font-size="18" text-anchor="middle">🍦</text>
        <circle cx="43" cy="43" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="27" y="66" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">Lickies</text>
      </g>

      <!-- Outlet 5: New Cafe -->
      <g transform="translate(272, 0)">
        <circle cx="27" cy="27" r="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <text x="27" y="31" fill="#0F172A" font-size="18" text-anchor="middle">🍕</text>
        <circle cx="43" cy="43" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="27" y="66" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">New Cafe</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. SPEED FILTERS ROW (1-Tap Intent Filters, Swiggy/Zomato style) -->
  <!-- ========================================================================= -->
  <g transform="translate(18, 268)">
    <!-- Cooked/Packed Minimal Segmented Toggle -->
    <rect x="0" y="0" width="138" height="30" rx="15" fill="#E2E8F0" />
    <rect x="2" y="2" width="68" height="26" rx="13" fill="#F06A05" />
    <text x="36" y="19" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle" class="font-sans">Cooked</text>
    <text x="103" y="19" fill="#475569" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">Packed</text>

    <!-- Speed Filter Pills -->
    <!-- Pill 1: Pure Veg (Active) -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="76" height="30" rx="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2" />
      <rect x="8" y="10" width="10" height="10" rx="2" fill="none" stroke="#10B981" stroke-width="1" />
      <circle cx="13" cy="15" r="2.5" fill="#10B981" />
      <text x="24" y="19" fill="#065F46" font-size="10" font-weight="800" class="font-sans">Pure Veg</text>
    </g>

    <!-- Pill 2: Under 30 -->
    <g transform="translate(230, 0)">
      <rect x="0" y="0" width="60" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="30" y="19" fill="#475569" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">&lt; ₹30</text>
    </g>

    <!-- Pill 3: Rating 4.5+ -->
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="43" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="21" y="19" fill="#475569" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">★ 4.5</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. STREAMLINED FOOD CARDS (Clean Anatomy, No Text Clipping) -->
  <!-- ========================================================================= -->
  <g transform="translate(18, 314)">
    
    <!-- CARD 1: Samosa (Order In • MITS Canteen) -->
    <g transform="translate(0, 0)">
      <!-- Card Container -->
      <rect width="162" height="230" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
      
      <!-- Photo Area -->
      <g transform="translate(2, 2)">
        <rect width="158" height="106" rx="16" fill="#F1F5F9" />
        <image href="/images/item_samosa_chicken.jpg" width="158" height="106" preserveAspectRatio="xMidYMid slice" clip-path="url(#foodThumbClip)" />
        
        <!-- Clean Bestseller Badge (Top-Left) -->
        <rect x="6" y="6" width="64" height="18" rx="6" fill="#0F172A" fill-opacity="0.85" />
        <text x="38" y="18" fill="#FBBF24" font-size="8.5" font-weight="800" text-anchor="middle" class="font-sans">★ BESTSELLER</text>

        <!-- Distance Chip (Bottom-Right, Zero Overlap) -->
        <rect x="94" y="82" width="58" height="18" rx="6" fill="#0F172A" fill-opacity="0.85" />
        <text x="123" y="94.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-sans">🚶 2m walk</text>
      </g>

      <!-- Details Section -->
      <g transform="translate(10, 120)">
        <!-- Veg Indicator + Title -->
        <g transform="translate(0, 0)">
          <rect x="0" y="2" width="11" height="11" rx="2.5" fill="none" stroke="#16A34A" stroke-width="1.2" />
          <circle cx="5.5" cy="7.5" r="2.5" fill="#16A34A" />
          <text x="16" y="12" fill="#0F172A" font-size="13" font-weight="800" class="font-sans">Samosa</text>
        </g>
        
        <!-- Shop & Rating Subline -->
        <text x="0" y="28" fill="#64748B" font-size="10" font-weight="600" class="font-sans">MITS Canteen • ★ 4.8</text>

        <!-- Price + Swiggy Style ADD+ CTA -->
        <g transform="translate(0, 48)">
          <text x="0" y="16" fill="#0F172A" font-size="16" font-weight="900" class="font-sans">₹15</text>
          
          <!-- Swiggy-Style Clean White ADD Button with Orange Border -->
          <g transform="translate(76, 0)">
            <rect x="0" y="0" width="66" height="28" rx="8" fill="#FFFFFF" stroke="#F06A05" stroke-width="1.5" />
            <text x="33" y="18" fill="#F06A05" font-size="11" font-weight="900" text-anchor="middle" class="font-sans">ADD +</text>
          </g>
        </g>
      </g>
    </g>

    <!-- CARD 2: Tea (Walk-In • MITS Canteen) -->
    <g transform="translate(177, 0)">
      <!-- Card Container -->
      <rect width="162" height="230" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
      
      <!-- Photo Area -->
      <g transform="translate(2, 2)">
        <rect width="158" height="106" rx="16" fill="#F1F5F9" />
        <image href="/images/item_tea.jpg" width="158" height="106" preserveAspectRatio="xMidYMid slice" clip-path="url(#foodThumbClip)" />
        
        <!-- Fresh Brew Badge -->
        <rect x="6" y="6" width="68" height="18" rx="6" fill="#0F172A" fill-opacity="0.85" />
        <text x="40" y="18" fill="#34D399" font-size="8.5" font-weight="800" text-anchor="middle" class="font-sans">☕ FRESH BREW</text>

        <!-- Distance Chip -->
        <rect x="94" y="82" width="58" height="18" rx="6" fill="#0F172A" fill-opacity="0.85" />
        <text x="123" y="94.5" fill="#FFFFFF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-sans">🚶 2m walk</text>
      </g>

      <!-- Details Section -->
      <g transform="translate(10, 120)">
        <!-- Veg Indicator + Title -->
        <g transform="translate(0, 0)">
          <rect x="0" y="2" width="11" height="11" rx="2.5" fill="none" stroke="#16A34A" stroke-width="1.2" />
          <circle cx="5.5" cy="7.5" r="2.5" fill="#16A34A" />
          <text x="16" y="12" fill="#0F172A" font-size="13" font-weight="800" class="font-sans">Special Tea</text>
        </g>
        
        <!-- Shop & Rating Subline -->
        <text x="0" y="28" fill="#64748B" font-size="10" font-weight="600" class="font-sans">MITS Canteen • ★ 4.6</text>

        <!-- Price + Walk-In MAP CTA -->
        <g transform="translate(0, 48)">
          <text x="0" y="16" fill="#0F172A" font-size="16" font-weight="900" class="font-sans">₹10</text>
          
          <!-- Green Walk-In Button -->
          <g transform="translate(76, 0)">
            <rect x="0" y="0" width="66" height="28" rx="8" fill="#059669" />
            <text x="33" y="18" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle" class="font-sans">MAP 📍</text>
          </g>
        </g>
      </g>
    </g>

    <!-- CARD 3: Masala Dosa (Row 2 preview) -->
    <g transform="translate(0, 246)">
      <rect width="162" height="180" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
      <g transform="translate(2, 2)">
        <rect width="158" height="96" rx="16" fill="#F1F5F9" />
        <image href="/images/item_masala_dosa.png" width="158" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#foodThumbClip)" />
      </g>
      <g transform="translate(10, 112)">
        <text x="0" y="12" fill="#0F172A" font-size="13" font-weight="800" class="font-sans">Masala Dosa</text>
        <text x="0" y="26" fill="#64748B" font-size="10" font-weight="600" class="font-sans">MITS Canteen • ★ 4.9</text>
        <text x="0" y="46" fill="#0F172A" font-size="15" font-weight="900" class="font-sans">₹40</text>
        <g transform="translate(76, 32)">
          <rect x="0" y="0" width="66" height="26" rx="8" fill="#FFFFFF" stroke="#F06A05" stroke-width="1.5" />
          <text x="33" y="17" fill="#F06A05" font-size="11" font-weight="900" text-anchor="middle" class="font-sans">ADD +</text>
        </g>
      </g>
    </g>

    <!-- CARD 4: Chicken Puff (Row 2 preview) -->
    <g transform="translate(177, 246)">
      <rect width="162" height="180" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
      <g transform="translate(2, 2)">
        <rect width="158" height="96" rx="16" fill="#F1F5F9" />
        <image href="/images/item_chicken_puff.jpg" width="158" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#foodThumbClip)" />
      </g>
      <g transform="translate(10, 112)">
        <text x="0" y="12" fill="#0F172A" font-size="13" font-weight="800" class="font-sans">Chicken Puff</text>
        <text x="0" y="26" fill="#64748B" font-size="10" font-weight="600" class="font-sans">New Cafe • ★ 4.5</text>
        <text x="0" y="46" fill="#64748B" font-size="11" font-weight="700" class="font-sans">Coming Soon</text>
        <g transform="translate(76, 32)">
          <rect x="0" y="0" width="66" height="26" rx="8" fill="#F1F5F9" />
          <text x="33" y="17" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">SOON</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. BOTTOM NAVIGATION BAR (Clean, Non-Intrusive Mobile Nav) -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 742)">
    <rect width="375" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Tab 1: Discover (Active) -->
    <g transform="translate(56, 14)">
      <path d="M 12 3 L 3 10 L 3 20 L 9 20 L 9 14 L 15 14 L 15 20 L 21 20 L 21 10 Z" fill="#F06A05" />
      <text x="12" y="32" fill="#F06A05" font-size="10" font-weight="800" text-anchor="middle" class="font-sans">Discover</text>
    </g>

    <!-- Tab 2: Saved -->
    <g transform="translate(187.5, 14)">
      <path d="M 6 4 L 18 4 C 19 4 20 5 20 6 L 20 22 L 12 18 L 4 22 L 4 6 C 4 5 5 4 6 4 Z" fill="none" stroke="#64748B" stroke-width="1.8" />
      <text x="12" y="32" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">Saved</text>
    </g>

    <!-- Tab 3: My Orders -->
    <g transform="translate(300, 14)">
      <path d="M 6 4 L 18 4 C 19 4 20 5 20 6 L 20 20 C 20 21 19 22 18 22 L 6 22 C 5 22 4 21 4 20 L 4 6 C 4 5 5 4 6 4 Z" fill="none" stroke="#64748B" stroke-width="1.8" />
      <line x1="8" y1="9" x2="16" y2="9" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
      <line x1="8" y1="13" x2="16" y2="13" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
      <text x="12" y="32" fill="#64748B" font-size="10" font-weight="600" text-anchor="middle" class="font-sans">Orders</text>
    </g>
  </g>
</svg>
