project_id = "YemEmUnnai"

[functions.vendor-pin-login]
# This endpoint authenticates the supplied PIN before issuing an Auth token.
verify_jwt = false

[functions.pickup]
# The handler validates each token with Auth, including anonymous buyer sessions.
verify_jwt = false

[auth]
enable_anonymous_sign_ins = true
enable_manual_linking = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5174", "http://127.0.0.1:5174"]

[auth.email]
enable_signup = true
enable_confirmations = true
